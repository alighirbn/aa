<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول تسوية الملاكات التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2733;--line:#9aa7b4;--soft:#eef2f6;--accent:#1f5a7a;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;color:var(--ink);background:#fff;line-height:1.6}
main{width:100%;max-width:none;margin:0;padding:12px 10px}
h1{font-size:1.25rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:26px 0 8px;padding-right:10px;border-right:4px solid var(--accent)}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:12px 0}
label{display:block;font-size:.85rem;font-weight:500;margin-bottom:2px}
input,select{width:100%;font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1px solid var(--line);padding:3px;vertical-align:middle}
th{background:var(--soft);font-size:.8rem;font-weight:700;padding:6px 4px}
.dt{direction:ltr;text-align:center}
td.nm{min-width:210px;width:24%}
td.nm input{min-width:0}
td.n{width:34px;text-align:center;font-size:.85rem}
td.x{width:34px;text-align:center}
td input,td select{border:0;padding:5px 3px;min-width:0;font-size:.85rem}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--accent);background:#fff;color:var(--accent);padding:6px 14px}
button.main{background:var(--accent);color:#fff}
button.del{border:0;color:var(--bad);padding:2px 8px;font-size:1.1rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
#msg{margin:12px 0;padding:10px;border-radius:4px;display:none}
#msg.ok{display:block;background:#e6f4ea;color:#14532d}
#msg.err{display:block;background:#fdecea;color:var(--bad)}
.err-cell{background:#fdecea}
.sign,.po{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  .noprint,button,.x{display:none!important}
  main{padding:0;max-width:none}
  table{min-width:0;font-size:10px}
  td input,td select{font-size:10px;appearance:none;-webkit-appearance:none;padding:2px}
  input,select{border:0}
  .wrap{overflow:visible}
  .po{display:block}
  .sign{display:flex;justify-content:flex-end;margin-top:30px}
  h2{margin-top:14px}
}
</style>
</head>
<body>
<main>
<h1>جدول آلية تسوية الملاكات التعليمية لمراكز محو الأمية ومدارس التعليم المسرّع</h1>

<div class="top">
  <div><label>قسم محو الأمية في المديرية العامة للتربية في</label><input id="dept" value="النجف"></div>
  <div class="noprint"><label>اسم المركز أو المدرسة (اختر من القائمة)</label><select id="center" onchange="onCenter()"><option value="">جارٍ تحميل القائمة…</option></select></div>
  <div class="noprint" id="pinBox" style="display:none"><label>رمز المركز (وصلك مع الرابط)</label><input id="pin" type="password" autocomplete="off"></div>
  <div class="noprint" style="align-self:end"><button type="button" onclick="restore()">استرجاع ما أرسلته سابقاً</button></div>
  <div class="po"><label>اسم المركز أو المدرسة</label><input id="centerPrint" readonly></div>
</div>

<h2>أسماء المطلوب بقاؤهم في المركز أو المدرسة</h2>
<div class="wrap"><table id="t-stay"></table></div>
<div class="bar noprint"><button type="button" onclick="addRow('stay')">+ إضافة اسم</button></div>

<h2>أسماء الفيض من المركز أو المدرسة</h2>
<div class="wrap"><table id="t-out"></table></div>
<div class="bar noprint"><button type="button" onclick="addRow('out')">+ إضافة اسم</button></div>

<h2>أعداد الدارسين حسب الصفوف والشعب</h2>
<div class="wrap"><table id="t-cls"></table></div>
<div class="bar noprint"><button type="button" onclick="addRow('cls')">+ إضافة صف</button></div>

<div class="sign"><div>مدير المركز / المدرسة: ........................</div></div>

<div id="msg" class="noprint"></div>
<div class="bar noprint">
  <button class="main" type="button" id="send" onclick="send()">إرسال البيانات</button>
  <button type="button" onclick="doPrint()">طباعة نسخة للتوقيع</button>
</div>
</main>

<script>
// ضع هنا رابط Apps Script (Web app URL) بعد النشر
const API_URL = "https://script.google.com/macros/s/AKfycbzMOjPN9iP-Qw2KTlEN2CHo805PbM3YNZe2F8qtn-A6nMuMp7AUdifbSxC_2ZWwRppOBw/exec";

const EDU = ["دبلوم","بكالوريوس","ماجستير","دكتوراه"];
const KALAK = ["ملاك محو الأمية","تكليف","تنسيب","نقل داخلي"];
const CFG = {
  stay:[["الاسم الرباعي","text"],["التحصيل الدراسي",EDU],["الاختصاص الدقيق","text"],["المواد التي يتم تدريسها","text"],["تأريخ مباشرة أول تعيين","date"],["نوع الملاك",KALAK],["تأريخ المباشرة في المركز أو المدرسة","date"],["المنصب إن وجد",["","مدير","معاون"]]],
  out:[["الاسم الرباعي","text"],["التحصيل الدراسي",EDU],["الاختصاص الدقيق","text"],["تأريخ مباشرة التعيين","date"],["نوع الملاك",KALAK],["تأريخ المباشرة في المركز أو المدرسة","date"],["حالة الفيض",["إنهاء تكليف","إنهاء تنسيب","تكليف إلى مركز أو مدرسة أخرى"]]],
  cls:[["نوع الصف",["أساس","تكميل","خامس","سادس","مستوى أول","مستوى ثاني","مستوى ثالث"]],["عدد الدارسين","number"],["عدد الشعب للصف الواحد","number"]]
};
const REQ = {stay:[0,1,2,3,4,5,6], out:[0,1,2,3,4,5,6], cls:[0,1,2]}; // الحقول الإلزامية (المنصب اختياري)
const T = k => document.getElementById("t-"+k);

// ===== إدخال التاريخ: اكتب الأرقام فقط (15032015) وتُضاف الشرطات تلقائياً =====
const AR="٠١٢٣٤٥٦٧٨٩";
function mask(el){
  const d=el.value.replace(/[٠-٩]/g,c=>AR.indexOf(c)).replace(/\D/g,"").slice(0,8);
  let o=d.slice(0,2); if(d.length>2) o+="/"+d.slice(2,4); if(d.length>4) o+="/"+d.slice(4,8);
  el.value=o;
}
document.addEventListener("input",e=>{ if(e.target.classList&&e.target.classList.contains("dt")) mask(e.target); });
function toISO(v){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v); if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3], dt=new Date(y,mo-1,d);
  if(y<1940||y>2040||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return m[3]+"-"+m[2]+"-"+m[1];
}

function init(){
  for(const k in CFG){
    T(k).innerHTML = "<thead><tr><th>ت</th>"+CFG[k].map(c=>"<th>"+c[0]+"</th>").join("")+"<th class='x'></th></tr></thead><tbody></tbody>";
    addRow(k);
  }
}

function cell(c){
  const t=c[1];
  if(Array.isArray(t)) return "<td><select>"+(t[0]===""?"":"<option value=''>— اختر —</option>")+t.map(o=>"<option>"+o+"</option>").join("")+"</select></td>";
  if(t==="date") return "<td><input type='text' class='dt' inputmode='numeric' maxlength='10' placeholder='يوم/شهر/سنة' autocomplete='off'></td>";
  return "<td"+(c[0]==="الاسم الرباعي"?" class='nm'":"")+"><input type='"+t+"'"+(t==="number"?" min='0' inputmode='numeric'":"")+"></td>";
}
function addRow(k){
  const tb=T(k).tBodies[0], tr=tb.insertRow();
  tr.innerHTML="<td class='n'></td>"+CFG[k].map(cell).join("")+"<td class='x'><button type='button' class='del' title='حذف الصف' onclick='delRow(this,\""+k+"\")'>×</button></td>";
  renum(k);
}
function delRow(b,k){ const tb=T(k).tBodies[0]; if(tb.rows.length>1) b.closest("tr").remove(); else b.closest("tr").querySelectorAll("input,select").forEach(e=>e.value=""); renum(k); }
function renum(k){ [...T(k).tBodies[0].rows].forEach((r,i)=>r.cells[0].textContent=i+1); }

function collect(k){
  const out=[];
  [...T(k).tBodies[0].rows].forEach(r=>{
    const f=[...r.querySelectorAll("input,select")];
    if(f.some(e=>e.value.trim()!=="")) out.push({el:f, vals:f.map(e=>e.value.trim())});
  });
  return out;
}

let CENTERS=[], ready=false;
const $=id=>document.getElementById(id);
async function loadCenters(){
  const s=$("center");
  const fail=t=>{ s.innerHTML="<option value=''>تعذر التحميل: "+t+"</option>"; };
  try{
    const r=await fetch(API_URL); const txt=await r.text(); let list;
    try{ list=JSON.parse(txt); }catch(e){ return fail("الرابط يرجع صفحة وليس بيانات (النشر ليس Anyone أو لم تُمنح الصلاحية)"); }
    if(list.error) return fail(list.error);
    if(!list.length) return fail("ورقة المراكز فارغة");
    CENTERS=list;
    s.innerHTML="<option value=''>— اختر المركز أو المدرسة —</option>"+list.map(c=>"<option>"+c.name+"</option>").join("");
  }catch(e){ fail("لا يمكن الوصول للرابط ("+e.message+")"); }
}
function onCenter(){ const c=CENTERS.find(x=>x.name===$("center").value); $("pinBox").style.display=(c&&c.locked)?"block":"none"; }

// ===== مسودة تلقائية على الجهاز =====
function snap(){ const d={center:$("center").value,dept:$("dept").value}; for(const k in CFG) d[k]=[...T(k).tBodies[0].rows].map(r=>[...r.querySelectorAll("input,select")].map(e=>e.value)); return d; }
let tm; document.addEventListener("input",saveDraft);
function saveDraft(){ if(!ready) return; clearTimeout(tm); tm=setTimeout(()=>{ try{ localStorage.setItem("tasweya_draft",JSON.stringify(snap())); }catch(e){} },400); }
function fill(d){
  if(d.dept) $("dept").value=d.dept;
  for(const k in CFG){
    const tb=T(k).tBodies[0]; tb.innerHTML="";
    const rows=(d[k]&&d[k].length)?d[k]:[null];
    rows.forEach(v=>{ addRow(k); if(v) [...tb.rows[tb.rows.length-1].querySelectorAll("input,select")].forEach((e,i)=>{ let x=(v[i]==null?"":String(v[i])); const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(x); if(m) x=m[3]+"/"+m[2]+"/"+m[1]; e.value=x; }); });
    renum(k);
  }
}
function loadDraft(){
  try{
    const d=JSON.parse(localStorage.getItem("tasweya_draft")||"null"); if(!d) return;
    if(!["stay","out","cls"].some(k=>(d[k]||[]).some(r=>r.some(v=>v!=="")))) return;
    fill(d); if(d.center && CENTERS.some(c=>c.name===d.center)){ $("center").value=d.center; onCenter(); }
    show("تم استرجاع مسودة محفوظة على هذا الجهاز. راجعها ثم أرسل أو اطبع.","ok");
  }catch(e){}
}

// ===== استرجاع المرسل سابقاً من الـ Sheet =====
function q(c){ return API_URL+"?center="+encodeURIComponent(c)+"&pin="+encodeURIComponent($("pin").value.trim()); }
async function restore(){
  const c=$("center").value; if(!c) return show("اختر اسم المركز أو المدرسة أولاً.","err");
  if(!confirm("سيتم استبدال ما هو مكتوب الآن بالبيانات التي أُرسلت سابقاً. متابعة؟")) return;
  try{
    const d=await (await fetch(q(c))).json();
    if(d.error) return show(d.error,"err");
    if(!d.found) return show("لا توجد بيانات مرسلة سابقاً لهذا المركز.","err");
    fill(d); saveDraft(); show("تم استرجاع البيانات المرسلة. عدّل ما تحتاج، ثم اطبع أو أعد الإرسال.","ok");
  }catch(e){ show("تعذر الاسترجاع، تحقق من الاتصال.","err"); }
}

function show(t,c){ const m=document.getElementById("msg"); m.className=c; m.textContent=t; m.scrollIntoView({block:"center"}); }

async function send(){
  document.querySelectorAll(".err-cell").forEach(e=>e.classList.remove("err-cell"));
  const center=document.getElementById("center").value;
  if(!center) return show("اختر اسم المركز أو المدرسة أولاً.","err");
  const data={center, dept:$("dept").value.trim(), pin:$("pin").value.trim()}; let bad=0;
  for(const k in CFG){
    const rows=collect(k);
    rows.forEach(r=>REQ[k].forEach(i=>{ if(!r.vals[i]){ r.el[i].classList.add("err-cell"); bad++; } }));
    rows.forEach(r=>r.el.forEach((e,i)=>{ if(e.classList.contains("dt") && r.vals[i]){ const iso=toISO(r.vals[i]); if(iso) r.vals[i]=iso; else { e.classList.add("err-cell"); bad++; } } }));
    rows.forEach(r=>{ const nm=r.vals[0]; if(k!=="cls" && nm && nm.split(/\s+/).length<4){ r.el[0].classList.add("err-cell"); bad++; } });
    data[k]=rows.map(r=>r.vals);
  }
  if(!data.stay.length && !data.out.length && !data.cls.length) return show("لم تُدخل أي بيانات.","err");
  if(bad) return show("هناك حقول ناقصة أو اسم غير رباعي (مظللة بالأحمر). أكملها ثم أعد الإرسال. التاريخ يُكتب أرقاماً فقط مثل 15032015.","err");
  const btn=$("send"); btn.disabled=true;
  try{
    const chk=await (await fetch(q(center))).json();
    if(chk.error){ btn.disabled=false; return show(chk.error,"err"); }
    if(!confirm("سيتم إرسال بيانات: "+center+(chk.found?"\nسبق أن أُرسلت بيانات لهذا المركز وستُستبدل بهذه.":"")+"\nمتابعة؟")){ btn.disabled=false; return; }
    await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(data)});
    show("تم إرسال البيانات. اطبع نسخة للتوقيع وسلّمها للجهاز التنفيذي. إذا نسيت الطباعة، اختر المركز واضغط (استرجاع ما أرسلته سابقاً).","ok");
    if(confirm("تم الإرسال. هل تريد طباعة النسخة الآن؟")) doPrint();
  }catch(e){ show("فشل الإرسال، تحقق من الاتصال وأعد المحاولة.","err"); }
  btn.disabled=false;
}

function doPrint(){
  document.getElementById("centerPrint").value=document.getElementById("center").value;
  // أظهر قيم القوائم عند الطباعة
  window.print();
}
init();
loadCenters().then(()=>{ loadDraft(); ready=true; });
</script>
</body>
</html>
